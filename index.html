<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reels Video Generator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090d16; 
            color: #fff; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .card { 
            background: #1e293b; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .file-upload-box {
            border: 2px dashed #475569;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
            background: #0f172a;
        }
        input[type="file"] { 
            color: #cbd5e1; 
            width: 100%; 
            font-size: 14px;
        }
        button { 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            padding: 14px 20px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { 
            margin-top: 20px; 
            font-size: 14px; 
            line-height: 1.5;
            padding: 10px;
            border-radius: 6px;
        }
        .loading { color: #facc15; background: rgba(250, 204, 21, 0.1); }
        .success { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .error { color: #f87171; background: rgba(248, 113, 113, 0.1); }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 AI Reels Generator</h2>
        <p>Upload file audio (MP3) Anda. AI akan otomatis membuat transkrip teks, mencarikan gambar tematik dari Pixabay, dan merender videonya di *cloud*!</p>
        
        <div class="file-upload-box">
            <input type="file" id="audioFile" accept="audio/mp3,audio/wav">
        </div>
        
        <button id="submitBtn" onclick="uploadAudio()">Buat Video Otomatis</button>
        
        <div id="status"></div>
    </div>

    <script>
        async function uploadAudio() {
            const fileInput = document.getElementById("audioFile");
            const statusDiv = document.getElementById("status");
            const submitBtn = document.getElementById("submitBtn");

            if (fileInput.files.length === 0) {
                alert("Silakan pilih file audio terlebih dahulu!");
                return;
            }

            const formData = new FormData();
            formData.append("audio", fileInput.files[0]);

            // Ubah UI menjadi status loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = "Memproses...";
            statusDiv.className = "loading";
            statusDiv.innerHTML = "⏳ Sedang meng-upload audio & menganalisis AI (Gemini & Pixabay). Mohon tunggu sebentar...";

            try {
                // Mengirim file ke backend Serverless Vercel (/api/generate)
                const response = await fetch("/api/generate", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.className = "success";
                    statusDiv.innerHTML = `✅ <b>Berhasil!</b> ${data.message}`;
                } else {
                    statusDiv.className = "error";
                    statusDiv.innerHTML = `❌ <b>Gagal:</b> ${data.message || "Terjadi kesalahan pada server."}`;
                }
            } catch (error) {
                console.error(error);
                statusDiv.className = "error";
                statusDiv.innerHTML = "❌ Gagal terhubung ke server Vercel.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Buat Video Otomatis";
            }
        }
    </script>
</body>
</html>
