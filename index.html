<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reels Video Generator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090d16; 
            color: #fff; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .card { 
            background: #1e293b; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .file-upload-box {
            border: 2px dashed #475569;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            background: #0f172a;
            text-align: left;
        }
        .file-upload-box label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        input[type="file"] { 
            color: #cbd5e1; 
            width: 100%; 
            font-size: 14px;
        }
        button { 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            padding: 14px 20px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { 
            margin-top: 20px; 
            font-size: 14px; 
            line-height: 1.5;
            padding: 10px;
            border-radius: 6px;
        }
        .loading { color: #facc15; background: rgba(250, 204, 21, 0.1); }
        .success { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .error { color: #f87171; background: rgba(248, 113, 113, 0.1); }
        .download-btn {
            display: inline-block;
            background: #22c55e;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .download-btn:hover { background: #16a34a; }
        video {
            width: 100%;
            max-height: 350px;
            border-radius: 8px;
            margin-top: 15px;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 AI Reels Generator</h2>
        <p>Pilih file audio Anda, lalu klik tombol untuk merender video secara otomatis di cloud.</p>
        
        <div class="file-upload-box">
            <label for="audioFile">Pilih File Audio (MP3/WAV):</label>
            <input type="file" id="audioFile" accept="audio/*">
        </div>
        
        <button id="submitBtn" onclick="triggerRender()">Mulai Render Video</button>
        
        <div id="status"></div>

        <!-- Area Preview & Download (Hanya muncul jika video benar-benar sudah jadi) -->
        <div id="resultContainer" style="display: none; margin-top: 20px;">
            <h3 style="color: #4ade80; font-size: 16px;">🎉 Video Berhasil Dibuat!</h3>
            <video id="videoPreview" controls></video>
            <a id="downloadBtn" href="/output-video.mp4" download="reels-ai.mp4" class="download-btn">⬇️ Download Video</a>
        </div>
    </div>

    <script>
        async function triggerRender() {
            const audioInput = document.getElementById("audioFile");
            const statusDiv = document.getElementById("status");
            const submitBtn = document.getElementById("submitBtn");
            const resultContainer = document.getElementById("resultContainer");

            if (audioInput.files.length === 0) {
                alert("Silakan pilih file audio terlebih dahulu!");
                return;
            }

            const formData = new FormData();
            formData.append("audio", audioInput.files[0]);

            submitBtn.disabled = true;
            submitBtn.innerHTML = "Mengupload & Memproses...";
            statusDiv.className = "loading";
            statusDiv.innerHTML = "⏳ Mengirim file audio dan memicu GitHub Actions...";
            resultContainer.style.display = "none";

            try {
                const response = await fetch("/api/generate", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.className = "success";
                    statusDiv.innerHTML = `✅ <b>Render Sedang Berjalan!</b> Mohon tunggu sekitar 1-2 menit, tombol download akan muncul otomatis setelah selesai.`;
                    
                    checkVideoReady();
                } else {
                    statusDiv.className = "error";
                    statusDiv.innerHTML = `❌ <b>Gagal:</b> ${data.message || "Terjadi kesalahan."}`;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Mulai Render Video";
                }
            } catch (error) {
                console.error(error);
                statusDiv.className = "error";
                statusDiv.innerHTML = "❌ Gagal terhubung ke server.";
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Mulai Render Video";
            }
        }

        function checkVideoReady() {
            const videoPreview = document.getElementById("videoPreview");
            const resultContainer = document.getElementById("resultContainer");
            const statusDiv = document.getElementById("status");
            const submitBtn = document.getElementById("submitBtn");

            let startTime = new Date().getTime();

            let interval = setInterval(async () => {
                try {
                    const res = await fetch("/output-video.mp4?t=" + new Date().getTime(), { method: "HEAD" });
                    
                    if (res.ok) {
                        const contentLength = res.headers.get("content-length");
                        
                        // Validasi ukuran file harus valid (> 10KB) untuk memastikan file bukan sisa cache kosong
                        if (contentLength && parseInt(contentLength) > 10000) {
                            clearInterval(interval);
                            
                            videoPreview.src = "/output-video.mp4?t=" + new Date().getTime();
                            resultContainer.style.display = "block";
                            statusDiv.innerHTML = "✅ Video Selesai Dirender dan Siap Ditonton!";
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = "Mulai Render Video";
                        }
                    }
                } catch (e) {
                    console.log("Menunggu video selesai dirender...");
                }

                let elapsedTime = (new Date().getTime() - startTime) / 1000;
                if (elapsedTime > 300) {
                    clearInterval(interval);
                    statusDiv.className = "error";
                    statusDiv.innerHTML = "❌ Waktu render habis. Silakan cek tab Actions di GitHub.";
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = "Mulai Render Video";
                }
            }, 7000);
        }
    </script>
</body>
</html>
