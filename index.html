<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reels Video Generator</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #090d16; 
            color: #fff; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .card { 
            background: #1e293b; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
        .file-upload-box {
            border: 2px dashed #475569;
            padding: 25px;
            border-radius: 10px;
            margin: 20px 0;
            background: #0f172a;
        }
        input[type="file"] { 
            color: #cbd5e1; 
            width: 100%; 
            font-size: 14px;
        }
        button { 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            padding: 14px 20px; 
            font-weight: bold; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 100%; 
            font-size: 16px; 
            transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { 
            margin-top: 20px; 
            font-size: 14px; 
            line-height: 1.5;
            padding: 10px;
            border-radius: 6px;
        }
        .loading { color: #facc15; background: rgba(250, 204, 21, 0.1); }
        .success { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .error { color: #f87171; background: rgba(248, 113, 113, 0.1); }
        .download-btn {
            display: inline-block;
            background: #22c55e;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .download-btn:hover { background: #16a34a; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 AI Reels Generator</h2>
        <p>Klik tombol di bawah untuk memicu sistem otomatis merender video reels di cloud!</p>
        
        <div class="file-upload-box">
            <input type="file" id="audioFile" accept="audio/*">
        </div>
        
        <button id="submitBtn" onclick="triggerRender()">Mulai Render Video</button>
        
        <div id="status"></div>

        <!-- Bagian Preview dan Download Video -->
        <div id="resultContainer" style="display: none; margin-top: 20px; text-align: left;">
            <h3 style="color: #4ade80; font-size: 16px; text-align: center;">🎉 Proses Berjalan di Cloud!</h3>
            <p style="text-align: center; font-size: 13px;">Video Anda sedang dirender di GitHub Actions. Setelah selesai (~1-2 menit), Anda bisa mengunduhnya langsung dari repository.</p>
            <a id="githubActionsLink" href="#" target="_blank" class="download-btn">📂 Buka GitHub Actions (Download Video)</a>
        </div>
    </div>

    <script>
        async function triggerRender() {
            const statusDiv = document.getElementById("status");
            const submitBtn = document.getElementById("submitBtn");
            const resultContainer = document.getElementById("resultContainer");

            submitBtn.disabled = true;
            submitBtn.innerHTML = "Memproses...";
            statusDiv.className = "loading";
            statusDiv.innerHTML = "⏳ Mengirim sinyal ke server cloud untuk memulai rendering...";
            resultContainer.style.display = "none";

            try {
                const response = await fetch("/api/generate", {
                    method: "POST"
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusDiv.className = "success";
                    statusDiv.innerHTML = `✅ <b>Berhasil!</b> Sinyal terkirim ke GitHub Actions.`;
                    
                    // Arahkan tombol ke halaman Actions repository Anda
                    document.getElementById("githubActionsLink").href = "https://github.com/Mardianto25/remotion-ai/actions";
                    resultContainer.style.display = "block";
                } else {
                    statusDiv.className = "error";
                    statusDiv.innerHTML = `❌ <b>Gagal:</b> ${data.message || "Terjadi kesalahan."}`;
                }
            } catch (error) {
                console.error(error);
                statusDiv.className = "error";
                statusDiv.innerHTML = "❌ Gagal terhubung ke server Vercel.";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = "Mulai Render Video";
            }
        }
    </script>
</body>
</html>
