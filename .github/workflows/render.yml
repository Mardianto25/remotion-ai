name: Render Remotion Video

on:
  repository_dispatch:
    types: [render-video]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Jalankan AI & Pixabay (Audio to Subtitles)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node src/audio-to-text.js

      - name: Render Video dengan Remotion
        run: npx remotion render src/index.ts MultiSceneVideo out/video.mp4

      - name: Upload Hasil Video
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: out/video.mp4

      - name: Commit & Push Video ke Repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add public/output-video.mp4
          git commit -m "chore: auto-update rendered video [skip ci]" || echo "No changes to commit"
          git push
